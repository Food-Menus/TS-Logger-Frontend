<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TS Logger System</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <h1>TS Logger System</h1>

    <section>
      <h2>إضافة موظف جديد</h2>

      <form id="employeeForm">

        <div class="form-group">
          <label for="employeeID">الرقم الوظيفي</label>
          <input type="number" id="employeeID" min="1" step="1" required>
        </div>

        <div class="form-group">
          <label for="employeeName">اسم الموظف</label>
          <input type="text" id="employeeName" required>
        </div>

        <div class="form-group">
          <label for="hourlyRate">سعر الساعة</label>
          <input type="number" id="hourlyRate" min="0.01" step="0.01" required>
        </div>

        <button type="submit" id="saveEmployeeButton">
          حفظ الموظف
        </button>

      </form>

      <p id="message"></p>
    </section>


    
<section>
  <h2>استيراد سجلات البصمات</h2>

  <div class="form-group">
    <label for="attendanceFile">اختيار ملف البصمات CSV</label>
    <input
      type="file"
      id="attendanceFile"
      accept=".csv,text/csv"
    >
  </div>

  <div id="attendanceImportArea" hidden>

    <h3>تصفية سجلات البصمات</h3>

    <div class="form-group">
      <label for="attendanceStartDate">من تاريخ</label>
      <input type="date" id="attendanceStartDate">
    </div>

    <div class="form-group">
      <label for="attendanceEndDate">إلى تاريخ</label>
      <input type="date" id="attendanceEndDate">
    </div>

    <div class="form-group">
      <label for="attendanceEmployeeFilter">
        اختيار الموظفين (يمكن اختيار أكثر من موظف)
      </label>

      <select id="attendanceEmployeeFilter" multiple size="6">
      </select>

      <small>عدم اختيار أي موظف يعني عرض جميع الموظفين.</small>
    </div>

    <button type="button" id="filterAttendanceButton">
      تطبيق التصفية
    </button>

    <div id="attendanceImportSummary"></div>

    <div id="attendancePreview">
    </div>

  </div>
</section>


    
    <section>
      <h2>الموظفون المسجلون</h2>

      <div class="form-group">
        <label for="employeeSearch">البحث عن موظف</label>
        <input
          type="search"
          id="employeeSearch"
          placeholder="ابحث بالرقم الوظيفي أو الاسم..."
        >
      </div>

      <button id="loadEmployees">
        تحديث قائمة الموظفين
      </button>

      <div id="employeeList">
        لم يتم تحميل البيانات بعد.
      </div>
    </section>

  </main>

  <!-- ID Image Modal -->
  <div id="imageModal" class="image-modal" aria-hidden="true">
    <div class="image-modal-content">

      <button
        type="button"
        id="closeImageModal"
        class="close-modal-button"
        aria-label="إغلاق"
      >
        &times;
      </button>

      <h2 id="imageModalTitle">صورة البطاقة</h2>

      <img id="modalImage" src="" alt="صورة بطاقة الموظف">

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
