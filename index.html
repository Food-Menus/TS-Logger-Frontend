
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TS Logger System</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <h1>TS Logger System</h1>

    <section>
      <h2>إضافة موظف جديد</h2>

      <form id="employeeForm">

        <div class="form-group">
          <label for="employeeID">الرقم الوظيفي</label>
          <input
            type="number"
            id="employeeID"
            min="1"
            step="1"
            required
          >
        </div>

        <div class="form-group">
          <label for="employeeName">اسم الموظف</label>
          <input
            type="text"
            id="employeeName"
            required
          >
        </div>

        <div class="form-group">
          <label for="hourlyRate">سعر الساعة</label>
          <input
            type="number"
            id="hourlyRate"
            min="0.01"
            step="0.01"
            required
          >
        </div>

        <button type="submit" id="saveEmployeeButton">
          حفظ الموظف
        </button>

      </form>

      <p id="message"></p>
    </section>

    <section>
      <h2>الموظفون المسجلون</h2>

      <button id="loadEmployees">
        تحديث قائمة الموظفين
      </button>

      <pre id="result">لم يتم تحميل البيانات بعد.</pre>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
